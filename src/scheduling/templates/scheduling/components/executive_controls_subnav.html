<!-- scheduling/components/executive_controls_subnav.html -->
<ul class="nav nav-pills exec-subnav mb-3 gap-1" role="tablist" aria-label="Executive Controls views">
    <li class="nav-item">
        <a class="nav-link py-1 px-3 {% if exec_subtab == 'overview' %}active{% endif %}"
           href="{% url 'scheduling:executive_controls' project.pk %}">
            Overview
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link py-1 px-3 {% if exec_subtab == 'matrix' %}active{% endif %}"
           href="{% url 'scheduling:executive_controls_matrix' project.pk %}">
            Matrix
        </a>
    </li>
    <li class="nav-item">
        {% if capability_profile %}
        {% if "trades" in capability_profile.recommended_visible_pages %}
        <a class="nav-link py-1 px-3 {% if exec_subtab == 'trades' %}active{% endif %}"
           href="{% url 'scheduling:executive_controls_trades' project.pk %}">
            Trades / Packages
        </a>
        {% else %}
        <span class="nav-link py-1 px-3 disabled text-secondary"
              title="{{ capability_profile.page_reasons.trades|default:'Trade analysis unavailable' }}">
            Trades / Packages
        </span>
        {% endif %}
        {% else %}
        <a class="nav-link py-1 px-3 {% if exec_subtab == 'trades' %}active{% endif %}"
           href="{% url 'scheduling:executive_controls_trades' project.pk %}">
            Trades / Packages
        </a>
        {% endif %}
