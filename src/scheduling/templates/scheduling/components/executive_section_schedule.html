<!-- scheduling/components/executive_section_schedule.html -->
<section id="exec-section-schedule" class="exec-section mb-4" aria-labelledby="exec-schedule-heading">
    <h2 class="h6 fw-semibold mb-3" id="exec-schedule-heading">
        <i class="bi bi-calendar-check me-1 text-primary"></i> Schedule Position
    </h2>
    {% if section_error %}
    <div class="alert alert-danger" role="alert">{{ section_error }}</div>
    {% else %}
    <p class="small text-secondary mb-2">Weighting: {{ weighting_note|default:"—" }}</p>
    <div class="row g-3">
        {% for card in cards %}
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            {% include "scheduling/components/executive_kpi_card.html" with card=card %}
        </div>
        {% endfor %}
    </div>
    {% endif %}
</section>
