<!-- takeoff/components/quantities_c5d_styles.html — 5D-UX-1A visual system (c5d-*) -->
<style>

    border-radius: var(--c5d-radius);
    background: var(--qty-surface);

    box-shadow: 0 1px 2px var(--castor-shadow, rgba(0, 0, 0, 0.05));
  }
  .qty-ws .c5d-card-header {

    flex-wrap: wrap;

    font-weight: 650;
    margin: 0;

    align-items: center;

    border-radius: var(--c5d-radius);
    background: var(--qty-surface-2);

  }
  .qty-ws .c5d-action-subtle.btn,
  .qty-ws a.c5d-action-subtle {

  }

    gap: 0.15rem;
    flex-wrap: wrap;
  }

    font-weight: 600;
    padding: 0.35rem 0.55rem;
    color: var(--qty-muted);
    border: 1px solid transparent;
    border-radius: 0.35rem 0.35rem 0 0;
  }
  .qty-ws .c5d-filter-tabs .nav-link.active {

    background: var(--qty-surface);
    border-color: var(--qty-border) var(--qty-border) var(--qty-surface);
  }
  .qty-ws .c5d-filter-pane {
    padding-top: 0.55rem;
  }

  .qty-ws .c5d-advanced {
    margin: 0 0.75rem 1rem;
    border: 1px dashed var(--qty-border);
    border-radius: var(--c5d-radius);
    padding: 0.35rem 0.65rem 0.55rem;
    background: transparent;
  }

    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--qty-muted);
    padding: 0.35rem 0;

    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding-top: 0.45rem;
  }

    padding: 0.55rem 0.6rem;
  }
  .qty-ws .c5d-support .table {
    font-size: 0.72rem;

    display: none;
  }

      display: table-cell;
